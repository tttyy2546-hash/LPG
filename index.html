<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจสอบและบันทึกโค้ด (Online Team)</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            color: #333;
            font-size: 1.5rem;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .form-group { margin-bottom: 15px; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-primary { background-color: #007bff; color: white; width: 100%; }
        .btn-primary:hover { background-color: #0056b3; }
        .btn-danger { background-color: #dc3545; color: white; }
        .btn-danger:hover { background-color: #bd2130; }
        .btn-success { background-color: #28a745; color: white; }
        .btn-success:hover { background-color: #218838; }

        .message-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            text-align: center;
            font-weight: bold;
        }
        .error-msg { background-color: #f8d7da; color: #721c24; }
        .success-msg { background-color: #d4edda; color: #155724; }

        .action-buttons {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            display: none;
            gap: 10px;
        }
        .action-buttons button { flex: 1; }

        .table-container {
            max-height: 400px;
            overflow-y: auto;
            width: 100%;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            transition: all 0.3s ease;
        }
        th { background-color: #f2f2f2; }
        .highlight-row {
            background-color: #fff3cd !important;
            border: 2px solid #ffc107 !important;
            transform: scale(1.01);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>ตรวจสอบโค้ด (ทีมออนไลน์)</h2>
        <div class="form-group">
            <input type="text" id="codeInput" placeholder="กรอกโค้ดที่ต้องการตรวจสอบ...">
        </div>
        <button class="btn-primary" id="verifyBtn" onclick="verifyCode()">ตรวจสอบ</button>

        <div id="messageBox" class="message-box"></div>

        <div id="actionButtons" class="action-buttons">
            <button class="btn-danger" onclick="cancelAction()">ยกเลิก</button>
            <button class="btn-success" onclick="addCode()">เพิ่มโค้ด</button>
        </div>
    </div>

    <div class="container">
        <h2>โค้ดที่เคยบันทึกพร้อมวันที่</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>โค้ด</th>
                        <th>วันที่บันทึกข้อมูล</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                    <tr><td colspan="2" style="text-align:center; color:#888;">กำลังเชื่อมต่อฐานข้อมูลออนไลน์...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // 🛠️ เชื่อมต่อกับโปรเจกต์ Cheknumber ของคุณเรียบร้อยแล้ว
        const firebaseConfig = {
            apiKey: "AIzaSyAvq7VPJ6g04DsySxqkzyoVh3f9CRWrmzc",
            authDomain: "cheknumber-254eb.firebaseapp.com",
            databaseURL: "https://cheknumber-254eb-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "cheknumber-254eb",
            storageBucket: "cheknumber-254eb.firebasestorage.app",
            messagingSenderId: "63118189821",
            appId: "1:63118189821:web:4794f2e26c839b1b654a94",
            measurementId: "G-Y91480ZPNV"
        };

        // เริ่มทำงานระบบ Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const codesRef = database.ref('savedCodes');

        let savedCodes = [];

        // ซิงค์ข้อมูลจากคลาวด์มาแสดงผลแบบ Realtime
        codesRef.on('value', (snapshot) => {
            savedCodes = [];
            const data = snapshot.val();
            if (data) {
                Object.keys(data).forEach(key => {
                    savedCodes.push({
                        id: key,
                        code: data[key].code,
                        date: data[key].date
                    });
                });
            }
            renderHistory();
        });

        // ฟังก์ชันวาดตารางแสดงข้อมูล
        function renderHistory() {
            const tableBody = document.getElementById('historyTableBody');
            tableBody.innerHTML = '';

            if (savedCodes.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="2" style="text-align:center; color:#888;">ไม่มีข้อมูลโค้ดที่บันทึกไว้</td></tr>`;
                return;
            }

            savedCodes.forEach(item => {
                const row = `<tr data-code="${item.code.toLowerCase()}">
                    <td><strong>${item.code}</strong></td>
                    <td>${item.date}</td>
                </tr>`;
                tableBody.innerHTML += row;
            });
        }

        // ฟังก์ชันตรวจสอบโค้ด
        function verifyCode() {
            const inputVal = document.getElementById('codeInput').value.trim();
            const messageBox = document.getElementById('messageBox');
            const actionButtons = document.getElementById('actionButtons');

            if (!inputVal) {
                alert('กรุณากรอกโค้ดก่อนกดตรวจสอบครับ');
                return;
            }

            clearHighlights();

            const allRows = document.querySelectorAll('#historyTableBody tr');
            let targetRow = null;

            allRows.forEach(row => {
                if (row.getAttribute('data-code') === inputVal.toLowerCase()) {
                    targetRow = row;
                }
            });

            if (targetRow) {
                messageBox.className = "message-box success-msg";
                messageBox.innerText = `พบโค้ด "${inputVal}" ในระบบเรียบร้อยแล้ว`;
                messageBox.style.display = "block";
                actionButtons.style.display = "none";

                targetRow.classList.add('highlight-row');
                targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else {
                messageBox.className = "message-box error-msg";
                messageBox.innerText = "ไม่มีโค้ดที่บันทึก";
                messageBox.style.display = "block";
                actionButtons.style.display = "flex"; 
            }
        }

        // ฟังก์ชันเพิ่มข้อมูลขึ้นคลาวด์ออนไลน์
        function addCode() {
            const inputVal = document.getElementById('codeInput').value.trim();
            if (!inputVal) return;

            const now = new Date();
            const formattedDate = now.toLocaleString('th-TH', { 
                day: '2-digit', 
                month: '2-digit', 
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });

            codesRef.push({
                code: inputVal,
                date: formattedDate
            }).then(() => {
                resetUI();
                alert(`บันทึกโค้ด "${inputVal}" ไปยังระบบออนไลน์สำเร็จ!`);
            }).catch((error) => {
                alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล: " + error.message);
            });
        }

        function cancelAction() { resetUI(); }

        function clearHighlights() {
            const allRows = document.querySelectorAll('#historyTableBody tr');
            allRows.forEach(row => row.classList.remove('highlight-row'));
        }

        function resetUI() {
            document.getElementById('codeInput').value = '';
            document.getElementById('messageBox').style.display = "none";
            document.getElementById('actionButtons').style.display = "none";
            clearHighlights();
        }
    </script>
</body>
</html>
