        const firebaseConfig = {

        };

        // เริ่มทำงานระบบ Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const codesRef = database.ref('savedCodes');

        let allRawData = {}; // เก็บข้อมูลดิบทั้งหมดจากคลาวด์

        // ฟังก์ชันเมื่อกดปุ่ม "ตรวจสอบ" เพื่อบันทึกข้อมูลลงคลาวด์
        function handleCheckAndSave() {
            const inputVal = document.getElementById('codeInput').value.trim();
            if (!inputVal) {
                alert('กรุณากรอกโค้ดก่อนครับ');
                return;
            }

            const now = new Date();
            const dateString = now.toLocaleString('th-TH', { hour12: false });
            
            // บันทึกแยกโครงสร้าง เดือน/ปี เพื่อให้ระบบใหม่กรองได้แม่นยำขึ้น
            codesRef.push({
                code: inputVal,
                dateString: dateString,
                timestamp: now.getTime(),
                month: now.getMonth() + 1, // เก็บค่าเป็น 1 - 12
                year: now.getFullYear()    // เก็บค่าคริสต์ศักราช เช่น 2026
            }).then(() => {
                document.getElementById('codeInput').value = ''; // ล้างช่องกรอกข้อมูล
            }).catch((error) => {
                alert('เกิดข้อผิดพลาดในการบันทึก: ' + error.message);
            });
        }

        // ซิงค์ข้อมูลจากคลาวด์มาแสดงผลแบบ Realtime
        codesRef.on('value', (snapshot) => {
            allRawData = snapshot.val() || {};
            renderTable(); // สั่งให้วาดตารางใหม่ทุกครั้งที่มีการอัปเดตข้อมูลหรือเปลี่ยนตัวกรอง
        });

        // ฟังก์ชันการกรองข้อมูลและวาดตารางแสดงผล
        function renderTable() {
            const tableBody = document.getElementById('historyTableBody');
            tableBody.innerHTML = ''; // ล้างตารางเดิมก่อน

            const selectedMonth = document.getElementById('filterMonth').value; // ค่าว่าง หรือ "1"-"12"
            const selectedYear = document.getElementById('filterYear').value;   // ค่าว่าง หรือ "2026"

            // แปลง Object ข้อมูลดิบให้กลายเป็น Array เพื่อนำมาจัดเรียงตามเวลาล่าสุดขึ้นก่อน
            const itemsArray = Object.keys(allRawData).map(key => {
                return { id: key, ...allRawData[key] };
            });

            // เรียงลำดับจากใหม่ล่าสุดไปเก่าสุด (อ้างอิงจากคีย์ของ Firebase หรือ timestamp)
            itemsArray.reverse();

            // กรองข้อมูลตามเดือนและปีที่ผู้ใช้เลือก
            const filteredItems = itemsArray.filter(item => {
                let itemMonth = item.month ? item.month.toString() : "";
                let itemYear = item.year ? item.year.toString() : "";

                // ระบบฉลาด: กรณีเป็นข้อมูลเก่าที่ไม่มีการบันทึก month/year แยกไว้ จะทำการแกะจากข้อความ dateString
                if (!itemMonth && item.dateString) {
                    const parts = item.dateString.split('/');
                    if (parts.length >= 2) {
                        itemMonth = parseInt(parts[1], 10).toString(); // ดึงเลขเดือนออกมา
                    }
                }
                if (!itemYear && item.dateString) {
                    const parts = item.dateString.split('/');
                    if (parts.length >= 3) {
                        // ดึงพาร์ทปีออกมา แล้วแปลงเป็น ค.ศ. เพื่อเปรียบเทียบมาตรฐานเดียวกัน
                        let rawYear = parseInt(parts[2].split(' ')[0], 10);
                        if (rawYear > 2500) rawYear = rawYear - 543; // ถ้าเป็น พ.ศ. ให้แปลงเป็น ค.ศ.
                        itemYear = rawYear.toString();
                    }
                }

                // ตรวจสอบเงื่อนไขตัวกรอง
                const matchMonth = selectedMonth === "" || itemMonth === selectedMonth;
                const matchYear = selectedYear === "" || itemYear === selectedYear;

<body>

    <div class="container">
        <div class="card">
            <h1>ตรวจสอบโค้ด (ทีมออนไลน์)</h1>
            
            <div class="input-row">
                <div class="kg-group">
                    <span>ถัง</span>
                    <input type="number" id="kgInput" placeholder="0" min="0">
                    <span>KG</span>
                </div>
                
                <input type="text" id="codeInput" class="code-input" placeholder="กรอกโค้ดที่ต้องการตรวจสอบ...">
            </div>
            
            <button class="btn" onclick="handleCheckAndSave()">ตรวจสอบ</button>
        </div>

        <div class="card">
            <h2>โค้ดที่เคยบันทึก</h2>
            
            <table>
                <thead>
                    <tr>
                        <th style="width: 30%;">ขนาดถัง</th>
                        <th style="width: 35%;">โค้ด</th>
                        <th style="width: 35%;">วันที่บันทึกข้อมูล</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                    </tbody>
            </table>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // 🛠️ ตรึงกุญแจเชื่อมต่อโปรเจกต์ Cheknumber ของคุณ
        const firebaseConfig = {
            apiKey: "AIzaSyAvq7VPJ6g04DsySxqkzyoVh3f9CRWrmzc",
            authDomain: "cheknumber-254eb.firebaseapp.com",
            databaseURL: "https://cheknumber-254eb-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "cheknumber-254eb",
            storageBucket: "cheknumber-254eb.firebasestorage.app",
            messagingSenderId: "63118189821",
            appId: "1:63118189821:web:4794f2e26c839b1b654a94",
            measurementId: "G-Y91480ZPNV"
        };

        // เริ่มทำงานระบบ Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const codesRef = database.ref('savedCodes'); // ใช้โฟลเดอร์หลักเดิมตามในตู้เซฟคุณ

        let allRawData = {}; 

        // ฟังก์ชันเมื่อกดปุ่ม "ตรวจสอบ" เพื่อบันทึกข้อมูลลง Firebase
        function handleCheckAndSave() {
            const kgVal = document.getElementById('kgInput').value.trim();
            const inputVal = document.getElementById('codeInput').value.trim();
            
            if (!inputVal) {
                alert('กรุณากรอกโค้ดก่อนครับ');
                return;
            }

            const now = new Date();
            const dateString = now.toLocaleString('th-TH', { hour12: false });
            
            // บันทึกทั้งรหัสโค้ด และ ขนาดถังแก๊สไปพร้อมกัน
            codesRef.push({
                code: inputVal,
                kg: kgVal ? kgVal : null, // ถ้าไม่ได้กรอกเลขถัง จะบันทึกเป็นค่าว่างไว้
                dateString: dateString,
                timestamp: now.getTime()
            }).then(() => {
                document.getElementById('codeInput').value = ''; // ล้างช่องกรอกโค้ด
                // หมายเหตุ: จงใจไม่ล้างช่องเลขถัง KG เผื่อทีมงานตรวจถังขนาดเดิมต่อเนื่อง จะได้ไม่ต้องกดพิมพ์เลขซ้ำ ๆ ครับ
            }).catch((error) => {
                alert('เกิดข้อผิดพลาดในการบันทึก: ' + error.message);
            });
        }

        // ดึงข้อมูลเวอร์ชันเดิมกลับมาแสดงผล Realtime (ป้องกันปัญหารหัสหาย)
        codesRef.on('value', (snapshot) => {
            allRawData = snapshot.val() || {};
            renderTable(); 
        });

        // ฟังก์ชันวาดตารางแบบเรียบง่ายและปลอดภัยต่อข้อมูลเก่า
        function renderTable() {
            const tableBody = document.getElementById('historyTableBody');
            tableBody.innerHTML = ''; // ล้างตารางเดิมก่อน

            // แปลงข้อมูลเป็น Array เพื่อเรียงลำดับเวลาล่าสุดขึ้นก่อน
            const itemsArray = Object.keys(allRawData).map(key => {
                return { id: key, ...allRawData[key] };
            });

            itemsArray.reverse(); // เอาล่าสุดขึ้นก่อน

            if (itemsArray.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="3" class="no-data">ไม่มีข้อมูลโค้ดที่บันทึกไว้</td></tr>`;
                return;
            }

            // แสดงผลลงตารางเรียงตามคอลัมน์ ขนาดถัง | โค้ด | วันที่
            itemsArray.forEach(item => {
                const row = document.createElement('tr');
                
                // ถ้ารหัสเก่าไม่มีขนาดถัง ให้โชว์เป็นเครื่องหมาย - แทน
                const kgDisplay = item.kg ? `ถัง <strong>${item.kg}</strong> KG` : '-';
                
                row.innerHTML = `
                    <td>${kgDisplay}</td>
                    <td><strong>${item.code || ''}</strong></td>
                    <td>${item.dateString || ''}</td>
                `;
                tableBody.appendChild(row);
            });
        }
    </script>
</body>
</html>
